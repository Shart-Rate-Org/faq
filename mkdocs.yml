      - "Как проходит верификация в Shart Rate": kak-prokhodit-verifikaciya-v-shart-rate.md
      - "Как создать сделку и подписать в Shart Rate": kak-sozdat-sdelku-i-podpisat-v-shart-rate.md
      - "Частичное погашение (со стороны заемщика)": chastichnoe-pogashenie-so-storony-zaemshika.md
      - "Полное погашение займа (со стороны заемщика)": polnoe-pogashenie-zaima-so-storony-zaemshika.md
      - "Продление сделки (со стороны заемщика)": prodlenie-sdelki-so-storony-zaemshika.md
