site_name: Shart Rate — помощь
site_description: "Инструкции по приложению Shart Rate: вход, верификация, сделки, подписание, погашение"
site_url: https://faq.shart-rate.com/
use_directory_urls: true
theme:
  name: material
  language: ru
  logo: assets/brand/logo.svg
  favicon: assets/brand/logo.svg
  font:
    text: Inter
  palette:
    - scheme: default
      primary: white
      accent: indigo
      toggle: {icon: material/brightness-7, name: Тёмная тема}
    - scheme: slate
      primary: black
      accent: indigo
      toggle: {icon: material/brightness-4, name: Светлая тема}
  features: [navigation.tabs, navigation.tabs.sticky, navigation.indexes, navigation.sections, navigation.top, search.suggest, search.highlight, content.code.copy]
plugins:
  - search:
      lang: [ru]
extra_css:
  - stylesheets/brand.css
extra:
  generator: false
  social:
    - icon: fontawesome/brands/apple
      link: https://apps.apple.com/kz/app/shart-rate/id6743425144
    - icon: fontawesome/brands/google-play
      link: https://play.google.com/store/apps/details?id=kz.shartrate
    - icon: fontawesome/solid/globe
      link: https://shart-rate.kz
markdown_extensions: [admonition, attr_list, md_in_html, tables, toc]
not_in_nav: |
  /registraciya-i-avtorizaciya.md
  /verifikaciya-kyc.md
  /dobro-pozhalovat-v-shart-rate.md
  /kz/shart-rate-ke-osh-keldi-iz.md
nav:
  - Русский:
      - "Главная": index.md
      - "Как это работает": kak-eto-rabotaet.md
      - "Вход и регистрация": kak-voiti-zaregistrirovatsya-v-shart-rate.md
      - "Верификация": kak-prokhodit-verifikaciya-v-shart-rate.md
      - "Создание и подписание сделки": kak-sozdat-sdelku-i-podpisat-v-shart-rate.md
      - "Подпись и пароль ЭЦП": polnyi-flou-podpisaniya-+-smena-sozdanie-parolya-ecp.md
      - "Частичное погашение": chastichnoe-pogashenie-so-storony-zaemshika.md
      - "Полное погашение": polnoe-pogashenie-zaima-so-storony-zaemshika.md
      - "Продление и изменение условий": prodlenie-sdelki-so-storony-zaemshika.md
      - "Заёмщик вернул деньги": zaemshik-vernul-dengi.md
      - "Фиксация долга": fiksaciya-dolga.md
  - Қазақша:
      - "Басты бет": kz/index.md
      - "Бұл қалай жұмыс істейді": kz/b-l-alai-zh-mys-isteidi.md
      - "Кіру және тіркелу": kz/shart-rate-osymshasyna-alai-kiruge-tirkeluge-bolady.md
      - "Верификация": kz/shart-rate-ta-verifikaciya-alai-tedi.md
      - "Мәміле жасау және қол қою": kz/shart-rate-ta-m-mile-zhasau-zh-ne-ol-oyu-n-s-auly-y.md
      - "Қолтаңба және ЭЦҚ құпия сөзі": kz/ec-piya-s-zin-ornatu-zgertu-zh-ne-zhat-a-ol-oyu-toly-procesi.md
      - "Ішінара өтеу": kz/ishinara-teu-aryz-alushy-zha-ynan.md
      - "Толық өтеу": kz/aryzdy-toly-teu-aryz-alushy-tarapynan.md
      - "Ұзарту және талаптарды өзгерту": kz/kelisimdi-zartu-aryz-alushy-tarapynan.md
      - "Қарыз алушы ақшаны қайтарды": kz/zaemshik-vernul-dengi.md
